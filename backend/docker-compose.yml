version: "3.9"

services:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: riis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: riis
      POSTGRES_USER: riis_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-riis_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riis_admin -d riis"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RIIS Backend (FastAPI) ────────────────────────────────────────────────
  backend:
    build: .
    container_name: riis-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override for docker — point to db service instead of localhost
      DATABASE_URL: postgresql+asyncpg://riis_admin:${DB_PASSWORD:-riis_dev_password}@db:5432/riis
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - ml_models:/app/ml_models

volumes:
  pgdata:
  uploads:
  ml_models:
